name: Signaler un problème
description: Un bug, un plantage ou un comportement inattendu de Next Drop Wheel.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Merci ! Pour une faille de sécurité, n'utilisez pas ce formulaire : voir SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Réglages > À propos.
      placeholder: '1.0.0'
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format installé
      options: [Installateur, Portable]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Système et version de rekordbox
      placeholder: Windows 11, rekordbox 7.2
  - type: textarea
    id: steps
    attributes:
      label: Ce qui s'est passé
      description: Les étapes pour reproduire, ce que vous attendiez et ce qui est arrivé.
    validations:
      required: true
